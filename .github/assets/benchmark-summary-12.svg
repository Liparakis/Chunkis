<svg xmlns="http://www.w3.org/2000/svg" width="960" height="712" viewBox="0 0 960 712" role="img" aria-labelledby="title desc">
<title id="title">Chunkis versus vanilla benchmark</title><desc id="desc">Twelve metrics from the unpinned three-run benchmark. Gray is vanilla, green is Chunkis. Lower is better. Rows are in the same order as the benchmark summary. See the text results linked from the README for exact values.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.bg{fill:#fff}.label{fill:#1f2328;font-size:15px;font-weight:600}.muted{fill:#59636e;font-size:13px}.value{fill:#59636e;font-size:13px;font-variant-numeric:tabular-nums}.delta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}.good{fill:#1a7f37}.bad{fill:#cf222e}.vanilla{fill:#8c959f}.chunkis{fill:#2da44e}.rule{stroke:#d1d9e0}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.label{fill:#f0f6fc}.muted,.value{fill:#a6b0bd}.good{fill:#56d364}.bad{fill:#ff7b72}.vanilla{fill:#7d8590}.chunkis{fill:#3fb950}.rule{stroke:#30363d}}
</style><rect width="960" height="712" class="bg"/>
<rect x="270" y="12" width="12" height="12" rx="2" class="vanilla"/><text x="290" y="23" class="label">Vanilla</text>
<rect x="378" y="12" width="12" height="12" rx="2" class="chunkis"/><text x="398" y="23" class="label">Chunkis</text>
<text x="940" y="23" text-anchor="end" class="muted">Change · lower is better</text>
<text x="16" y="72" class="label">Tick p50</text>
<rect x="270" y="49" width="352.11" height="13" rx="3" class="vanilla"/><text x="630.11" y="60" class="value">27.3 ms</text>
<rect x="270" y="68" width="400.00" height="13" rx="3" class="chunkis"/><text x="678.00" y="79" class="value">31.0 ms</text>
<text x="940" y="72" text-anchor="end" class="delta bad">+14%</text>
<line x1="16" y1="92" x2="940" y2="92" class="rule"/>
<text x="16" y="126" class="label">Tick p90</text>
<rect x="270" y="103" width="319.18" height="13" rx="3" class="vanilla"/><text x="597.18" y="114" class="value">35.4 ms</text>
<rect x="270" y="122" width="400.00" height="13" rx="3" class="chunkis"/><text x="678.00" y="133" class="value">44.4 ms</text>
<text x="940" y="126" text-anchor="end" class="delta bad">+25%</text>
<line x1="16" y1="146" x2="940" y2="146" class="rule"/>
<text x="16" y="180" class="label">Tick p99</text>
<rect x="270" y="157" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="168" class="value">314.3 ms</text>
<rect x="270" y="176" width="248.75" height="13" rx="3" class="chunkis"/><text x="526.75" y="187" class="value">195.4 ms</text>
<text x="940" y="180" text-anchor="end" class="delta good">−38%</text>
<line x1="16" y1="200" x2="940" y2="200" class="rule"/>
<text x="16" y="234" class="label">Late ticks</text>
<rect x="270" y="211" width="361.54" height="13" rx="3" class="vanilla"/><text x="639.54" y="222" class="value">15.7</text>
<rect x="270" y="230" width="400.00" height="13" rx="3" class="chunkis"/><text x="678.00" y="241" class="value">17.3</text>
<text x="940" y="234" text-anchor="end" class="delta bad">+11%</text>
<line x1="16" y1="254" x2="940" y2="254" class="rule"/>
<text x="16" y="288" class="label">Total lateness</text>
<rect x="270" y="265" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="276" class="value">2,031.7 ms</text>
<rect x="270" y="284" width="275.50" height="13" rx="3" class="chunkis"/><text x="553.50" y="295" class="value">1,399.3 ms</text>
<text x="940" y="288" text-anchor="end" class="delta good">−31%</text>
<line x1="16" y1="308" x2="940" y2="308" class="rule"/>
<text x="16" y="342" class="label">Unload p50</text>
<rect x="270" y="319" width="292.20" height="13" rx="3" class="vanilla"/><text x="570.20" y="330" class="value">162.8 ms</text>
<rect x="270" y="338" width="400.00" height="13" rx="3" class="chunkis"/><text x="678.00" y="349" class="value">222.9 ms</text>
<text x="940" y="342" text-anchor="end" class="delta bad">+37%</text>
<line x1="16" y1="362" x2="940" y2="362" class="rule"/>
<text x="16" y="396" class="label">Reload p50</text>
<rect x="270" y="373" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="384" class="value">976.5 ms</text>
<rect x="270" y="392" width="365.21" height="13" rx="3" class="chunkis"/><text x="643.21" y="403" class="value">891.5 ms</text>
<text x="940" y="396" text-anchor="end" class="delta good">−9%</text>
<line x1="16" y1="416" x2="940" y2="416" class="rule"/>
<text x="16" y="450" class="label">Reload p99</text>
<rect x="270" y="427" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="438" class="value">1,162.4 ms</text>
<rect x="270" y="446" width="364.36" height="13" rx="3" class="chunkis"/><text x="642.36" y="457" class="value">1,058.8 ms</text>
<text x="940" y="450" text-anchor="end" class="delta good">−9%</text>
<line x1="16" y1="470" x2="940" y2="470" class="rule"/>
<text x="16" y="504" class="label">Total CPU</text>
<rect x="270" y="481" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="492" class="value">62.3 s</text>
<rect x="270" y="500" width="337.72" height="13" rx="3" class="chunkis"/><text x="615.72" y="511" class="value">52.6 s</text>
<text x="940" y="504" text-anchor="end" class="delta good">−16%</text>
<line x1="16" y1="524" x2="940" y2="524" class="rule"/>
<text x="16" y="558" class="label">Server CPU</text>
<rect x="270" y="535" width="352.28" height="13" rx="3" class="vanilla"/><text x="630.28" y="546" class="value">10.0 s</text>
<rect x="270" y="554" width="400.00" height="13" rx="3" class="chunkis"/><text x="678.00" y="565" class="value">11.3 s</text>
<text x="940" y="558" text-anchor="end" class="delta bad">+14%</text>
<line x1="16" y1="578" x2="940" y2="578" class="rule"/>
<text x="16" y="612" class="label">Heap</text>
<rect x="270" y="589" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="600" class="value">1,173.4 MB</text>
<rect x="270" y="608" width="297.95" height="13" rx="3" class="chunkis"/><text x="575.95" y="619" class="value">874.0 MB</text>
<text x="940" y="612" text-anchor="end" class="delta good">−26%</text>
<line x1="16" y1="632" x2="940" y2="632" class="rule"/>
<text x="16" y="666" class="label">Disk</text>
<rect x="270" y="643" width="400.00" height="13" rx="3" class="vanilla"/><text x="678.00" y="654" class="value">61.7 MB</text>
<rect x="270" y="662" width="277.97" height="13" rx="3" class="chunkis"/><text x="555.97" y="673" class="value">42.9 MB</text>
<text x="940" y="666" text-anchor="end" class="delta good">−31%</text>
<line x1="16" y1="686" x2="940" y2="686" class="rule"/>
<text x="940" y="706" text-anchor="end" class="muted">Bar lengths are comparable within each row.</text></svg>
